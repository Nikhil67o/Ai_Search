apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend-deployment
  labels:
    app: ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
      - name: backend
        image: your-dockerhub-username/ai-search-backend:latest # Apni image push karke yahan naam dalein
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"